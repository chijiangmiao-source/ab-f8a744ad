# 束流整形磁铁垫片整数校正量复核系统 — Compose
# web：常驻页面/API 服务，宿主端口可通过环境变量 HOST_PORT 配置（默认 8080）。
# verify：一次性验收服务，对运行中的 web 执行：
#   不可整除约束无解证据确认 -> 代码测试 -> 构建检查 -> HTTP 冒烟（健康路径 + 复核接口），
#   以退出码报告结果后退出（docker compose run verify 可查看退出码；compose run 默认透传）。

services:
  web:
    build: .
    image: shim-review:latest
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
    ports:
      # 可配置宿主端口：HOST_PORT=9090 docker compose up
      - "${HOST_PORT:-8080}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  verify:
    build: .
    image: shim-review:latest
    depends_on:
      web:
        # 等待健康检查通过后再开始验收
        condition: service_healthy
    environment:
      BASE_URL: "http://web:3000"
    entrypoint: ["node", "scripts/verify.js"]
    restart: "no"
